name: Update NT warnings

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch warnings from the Bureau of Meteorology
        run: python fetch_warnings.py

      - name: Commit warnings.json if it changed
        run: |
          git config user.name "warnings-bot"
          git config user.email "actions@github.com"
          git add warnings.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Update warnings $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
